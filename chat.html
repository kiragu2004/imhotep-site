<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Imhotep</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div class="logo">⚡ IMHOTEP</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="capabilities.html">Capabilities</a></li>
    <li><a href="debate.html">Debate</a></li>
    <li><a href="pricing.html">Pricing</a></li>
  </ul>
  <div class="nav-buttons">
    <span class="engine-badge">Imhotep Engine</span>
    <span id="user-display" style="color:var(--text-secondary); font-size:.9rem;">Guest</span>
    <button class="nav-btn" onclick="logout()">Sign Out</button>
  </div>
</nav>
<div class="sidebar" id="sidebar">
  <h3>💾 Session</h3>
  <div class="credits-card">
    <div class="label">Credits Remaining</div>
    <div class="number" id="credits-num">—</div>
    <div class="sub" id="credits-sub">— / —</div>
  </div>
  <h3 style="margin-top:1.5rem;">📜 History</h3>
  <div class="history-list" id="history-list">
    <div style="color:var(--text-muted); font-size:.8rem;">No chats yet</div>
  </div>
</div>
<button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
<div class="chat-container with-sidebar" id="chat-container">
  <div class="chat-messages" id="messages">
    <div id="welcome" style="text-align:center; margin:auto; max-width:620px;">
      <h2 style="background:var(--gradient-neon); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; font-size:2rem; margin-bottom:1rem;">Welcome to Imhotep</h2>
      <p style="color:var(--text-secondary); line-height:1.8;">22 agents. Unlimited memory. Real reasoning.</p>
      <div style="margin-top:2rem; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1rem; max-width:520px; margin-inline:auto;">
        <button class="agent-pick" onclick="pickAgent('generalist'); sendPrompt('Hello Imhotep!')"><div class="emoji">🤖</div><div class="name">Generalist</div></button>
        <button class="agent-pick" onclick="pickAgent('scientist'); sendPrompt('Explain CRISPR gene editing')"><div class="emoji">🧬</div><div class="name">Scientist</div></button>
        <button class="agent-pick" onclick="pickAgent('coder'); sendPrompt('React hooks best practices')"><div class="emoji">💻</div><div class="name">Developer</div></button>
        <button class="agent-pick" onclick="pickAgent('writer'); sendPrompt('Write about Nairobi sunsets')"><div class="emoji">✍️</div><div class="name">Writer</div></button>
      </div>
    </div>
  </div>
  <div class="chat-input-area">
    <div class="chat-input-field">
      <div class="rate-bar" id="rate-bar" style="display:none;">
        <span id="rate-label">—</span>
        <div class="track"><div class="fill" id="rate-fill"></div></div>
      </div>
      <div class="weather-widget" id="weather-widget" style="display:none;">
        <div class="w-left">
          <span class="w-emoji" id="w-emoji">🌤️</span>
          <div><div class="w-temp" id="w-temp">—°C</div><div class="w-city" id="w-city">—</div></div>
        </div>
        <div style="text-align:right;">
          <div id="w-cond" style="color:var(--text-secondary);">—</div>
          <div style="color:var(--text-muted); font-size:.78rem;" id="w-hum">—</div>
        </div>
      </div>
      <div class="temp-control">
        <label for="temp">Temperature</label>
        <input id="temp" type="range" min="0" max="2" step="0.1" value="0.7">
        <span class="temp-val" id="temp-val">0.7</span>
      </div>
      <textarea id="prompt" placeholder="Ask Imhotep anything… (Enter to send, Shift+Enter for new line)" onkeypress="onKey(event)"></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendChat()">Send</button>
  </div>
</div>
<script>
const API = "https://imhotep-agentic-ai.onrender.com";
let selectedAgent = "generalist";
let userLocation = null;
let sidebarOpen = true;
const tempEl = document.getElementById("temp");
const tempVal = document.getElementById("temp-val");
tempEl.addEventListener("input", e => { tempVal.textContent = parseFloat(e.target.value).toFixed(1); });
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById("sidebar").classList.toggle("hidden");
  document.getElementById("chat-container").classList.toggle("with-sidebar");
}
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => { userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude }; document.getElementById("weather-widget").style.display = "flex"; },
    () => {}, { timeout: 6000 }
  );
}
async function checkAuth() {
  const token = localStorage.getItem("imhotep_token");
  const user = JSON.parse(localStorage.getItem("imhotep_user") || "{}");
  document.getElementById("user-display").textContent = token ? (user.name || "User") : "Guest";
  const userId = localStorage.getItem("imhotep_user_id");
  if (userId) {
    try {
      const r = await fetch(API + "/user/profile?user_id=" + userId);
      const data = await r.json();
      if (data.ok) {
        document.getElementById("credits-num").textContent = data.credits.remaining;
        document.getElementById("credits-sub").textContent = data.credits.used + "/" + data.credits.limit;
      }
    } catch (e) { console.log(e); }
    loadChatHistory();
  }
}
async function loadChatHistory() {
  const userId = localStorage.getItem("imhotep_user_id");
  if (!userId) return;
  try {
    const r = await fetch(API + "/chat/history?user_id=" + userId);
    const data = await r.json();
    const list = document.getElementById("history-list");
    if (data.ok && data.history.length > 0) {
      list.innerHTML = "";
      data.history.slice(-20).reverse().forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.onclick = () => sendPrompt(item.prompt);
        div.innerHTML = '<div class="agent">' + escapeHtml(item.agent || "generalist") + '</div><div class="text">' + escapeHtml(item.prompt).substring(0, 60) + '…</div>';
        list.appendChild(div);
      });
    }
  } catch (e) { console.log(e); }
}
function pickAgent(a) { selectedAgent = a; }
async function sendChat() { const v = document.getElementById("prompt").value.trim(); if (!v) return; await sendPrompt(v); }
async function sendPrompt(prompt) {
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();
  const u = document.createElement("div");
  u.className = "message user";
  u.textContent = prompt;
  messages.appendChild(u);
  messages.scrollTop = messages.scrollHeight;
  document.getElementById("prompt").value = "";
  const skel = document.createElement("div");
  skel.className = "message imhotep skeleton";
  skel.style.width = "180px"; skel.style.height = "44px";
  skel.innerHTML = "&nbsp;";
  messages.appendChild(skel);
  messages.scrollTop = messages.scrollHeight;
  const btn = document.getElementById("send-btn");
  btn.disabled = true; btn.textContent = "…";
  try {
    const userId = localStorage.getItem("imhotep_user_id");
    const temperature = parseFloat(tempEl.value);
    const r = await fetch(API + "/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, agent: selectedAgent, user_id: userId, temperature, location: userLocation }),
    });
    if (!r.ok) { const text = await r.text(); throw new Error("HTTP " + r.status + ": " + text.slice(0, 200)); }
    const data = await r.json();
    skel.remove();
    if (!data.ok) throw new Error(data.error || "unknown");
    if (data.thoughts && data.thoughts.length > 5) {
      const t = document.createElement("div");
      t.className = "thoughts-panel";
      t.textContent = data.thoughts;
      messages.appendChild(t);
    }
    const a = document.createElement("div");
    a.className = "message imhotep";
    a.innerHTML = escapeHtml(data.reply).replace(/\n/g, "<br>").replace(/\[source:\s*([^\]]+)\]/gi, '<a href="$1" target="_blank" rel="noopener">[source]</a>');
    messages.appendChild(a);
    if (data.weather) {
      const w = data.weather;
      document.getElementById("weather-widget").style.display = "flex";
      document.getElementById("w-temp").textContent = w.temp + "°C";
      document.getElementById("w-cond").textContent = w.condition || "";
      document.getElementById("w-city").textContent = w.city || "Your area";
      document.getElementById("w-hum").textContent = (w.humidity || "—") + "% humidity";
      document.getElementById("w-emoji").textContent = /cloud/i.test(w.condition) ? "☁️" : /rain|drizzle/i.test(w.condition) ? "🌧️" : /clear|sun/i.test(w.condition) ? "☀️" : "🌤️";
    }
    if (data.credits) {
      document.getElementById("credits-num").textContent = data.credits.remaining;
      document.getElementById("credits-sub").textContent = data.credits.used + "/" + data.credits.limit;
      const pct = data.credits.limit ? Math.min(100, (data.credits.used / data.credits.limit) * 100) : 0;
      document.getElementById("rate-bar").style.display = "flex";
      document.getElementById("rate-fill").style.width = pct + "%";
      document.getElementById("rate-label").textContent = data.credits.remaining + " left · " + data.credits.used + "/" + data.credits.limit;
      if (!data.credits.allowed) { alert("⚠️ No credits left. Upgrade to continue chatting."); setTimeout(() => window.location.href = "pricing.html", 1000); }
    }
    loadChatHistory();
  } catch (err) {
    skel.remove();
    const e = document.createElement("div");
    e.className = "message imhotep"; e.style.color = "#ff6b6b";
    e.textContent = "Error: " + err.message;
    messages.appendChild(e);
  } finally {
    btn.disabled = false; btn.textContent = "Send";
    messages.scrollTop = messages.scrollHeight;
  }
}
function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function onKey(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } }
function logout() { ["imhotep_token","imhotep_user_id","imhotep_user","imhotep_mode"].forEach(k => localStorage.removeItem(k)); window.location.href = "auth.html"; }
checkAuth();
</script>
</body>
</html>
